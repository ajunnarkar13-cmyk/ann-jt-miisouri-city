services:
  - type: web
    name: ann-jt-missouri-city
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANN_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
