{% extends "base.html" %}
{% block title %}Lookup{% endblock %}
{% block body %}
<div class="card">
  <h1>Guest lookup</h1>
  <form method="get">
    <label>Phone</label>
    <input name="phone" value="{{ phone }}" inputmode="tel" placeholder="(281) 555-0100" />
    <p style="margin-top:1rem"><button type="submit">Find</button></p>
  </form>
</div>
{% endblock %}
